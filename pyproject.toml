[project]
name = "assay"
version = "0.0.1"
description = "Evidence-first incident investigation for small self-hosted systems"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
assay = "assay.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyyaml>=6",
    "types-PyYAML>=6",
]
# Dependencies of the lab demo service, needed only to run its tests locally.
lab = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "redis>=5",
    "prometheus-client>=0.20",
]

[tool.uv]
default-groups = ["dev", "lab"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assay"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["assay", "shop", "scenario_runner"]

[tool.mypy]
strict = true
files = ["src", "lab/scenario_runner.py"]

[tool.pytest.ini_options]
testpaths = ["tests", "lab/tests", "lab/app/tests"]
pythonpath = ["lab", "lab/app"]
addopts = "-q"
