# Control scenario: a harmless release shortly before an unrelated failure.
# It checks honesty, not cleverness: the release came first, but it is not the cause.
# The ground truth below is read only by the lab and the evaluation code,
# never by Assay itself.

id: false-trail-release
title: Harmless release two minutes before Redis goes down
description: >
  A new version of the shop with no functional change is deployed. Two minutes later
  Redis is stopped, as in redis-down. A tool that blames "whatever changed last" will
  point at the release.

warmup_seconds: 240
events:
  - after_seconds: 120
    action: deploy_service
    service: app
    version: 1.0.1
fault:
  action: stop_service
  service: redis
duration_seconds: 180
recovery:
  action: start_service
  service: redis
cooldown_seconds: 120

ground_truth:
  root_cause_type: dependency_unavailable
  component: redis
  expected_symptoms:
    - rise of HTTP 503 on /items/{item_id}
    - redis connection errors in app logs
  fix: start redis
  # Causes that the data may hint at but that are wrong.
  distractors:
    - root_cause_type: recent_change
      component: app
